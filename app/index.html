<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="My Future Pension — a concept platform for the Pension Fund of the Republic of Uzbekistan. Demonstration only; all data is fictional."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23123C78'/%3E%3Cpath d='M16 6.5l2.9 4.2 4.9 1.4-3.1 4.1.2 5.1-4.9-1.7-4.9 1.7.2-5.1-3.1-4.1 4.9-1.4z' fill='%2334BC82'/%3E%3C/svg%3E"
    />
    <title>My Future Pension — Pension Fund of the Republic of Uzbekistan</title>
    <script>
      // Applied before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('mfp-theme')
          var isDark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.classList.toggle('light', !isDark)
        } catch (e) {
          /* localStorage unavailable — fall back to the light default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
